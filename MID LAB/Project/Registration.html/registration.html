<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Style.css">
    <title>Admin Registration</title>
</head>
<body>
    <div class="logobox">
        <video src="logo.mp4" poster="logo.png" id="logo" autoplay muted playsinline></video>
    </div>

    <h1>Admin Registration</h1>
    <form>
        <fieldset>
            <legend>Admin Registration</legend>
            <table>
                <tr>
                    <td><label for="AdminName">Name: </label></td>
                    <td>
                        <input type="text" name="AdminName" id="AdminName" placeholder="Enter Your Name">
                        <p id="NameError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="AdminEmail">Email: </label></td>
                    <td>
                        <input type="email" name="AdminEmail" id="AdminEmail" placeholder="Enter Your Email">
                        <p id="EmailError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="AdminPhone">Phone: </label></td>
                    <td>
                        <input type="text" name="AdminPhone" id="AdminPhone" placeholder="Enter Your Phone Number">
                        <p id="PhoneError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label>Gender:</label></td>
                    <td>
                        <input type="radio" name="AdminGender" id="Male" value="Male">Male
                        <input type="radio" name="AdminGender" id="Female" value="Female">Female
                        <input type="radio" name="AdminGender" id="Other" value="Other">Other
                        <p id="GenderError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="AdminPassword">Password:</label></td>
                    <td>
                        <input type="password" name="AdminPassword" id="AdminPassword" placeholder="Enter Your Passoword">
                        <p id="PasswordError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="ConfirmPassword">Confirm Password: </label></td>
                    <td>
                        <input type="password" name="ConfirmPassword" id="ConfirmPassword" placeholder="Re-enter Your Passoword">
                        <p id="ConfirmError"></p>
                    </td>
                </tr>
            </table>
        </fieldset>
        <div class="buttons">
            <input type="submit" id="submit" value="Register">
            <input type="reset" id="reset" value="Reset">
        </div>
        <div class="loginlink">Already have an account? <a href="login.html">Login</a></div>
    </form>
    <script src="validation.js"></script>
</body>
</html>
