<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Style.css">
    <title>Admin Registration</title>
</head>
<body>
    <div class="logobox">
        <video src="logo.mp4" poster="logo.png" id="logo" autoplay muted playsinline></video>
    </div>

    <h1>Admin Registration</h1>
    <form>
        <fieldset>
            <legend>Admin Registration</legend>
            <table>
                <tr>
                    <td><label for="AdminName">Name: </label></td>
                    <td>
                        <input type="text" name="AdminName" id="AdminName" placeholder="Enter Your Name">
                        <p id="NameError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="AdminEmail">Email: </label></td>
                    <td>
                        <input type="email" name="AdminEmail" id="AdminEmail" placeholder="Enter Your Email">
                        <p id="EmailError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="AdminPhone">Phone: </label></td>
                    <td>
                        <input type="text" name="AdminPhone" id="AdminPhone" placeholder="Enter Your Phone Number">
                        <p id="PhoneError"></p>
                    </td>
                </tr>

</body>
</html>
